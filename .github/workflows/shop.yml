name: Scrape shop

on:
  schedule:
    # Weekly, Monday 05:10 UTC. Deals of the Month rotate monthly and the
    # gift card lineup changes slowly, so daily would be wasted requests.
    # Offset from the other scrapers so runs don't overlap.
    - cron: "10 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run shop scraper
        run: python scraper/scrape_shop.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shop
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update shop data"
            git push
          fi
